<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A bar exam study dashboard built with Claude: spaced repetition flashcards, blank page recall, MBE error log, focus mode and progress tracking. Demo with sample data.">
<title>Bar Prep Dashboard Demo</title>
</head>
<body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: a colorful study desk. A navy masthead with greeting, affirmation and countdowns, a pill tab rail, then one column of panels per view. Each bar subject has its own color everywhere it appears. Focus mode takes over the screen. */
:root{
  --bg:#F5F6FA; --surface:#FFFFFF; --sunk:#EDF0F6; --ink:#151A2D; --muted:#5B6278; --line:#DDE1EB;
  --mast:#16204A; --mast-ink:#F4F6FF; --mast-muted:#B8C0E6;
  --accent:#3D5AFE; --accent-ink:#FFFFFF; --accent-soft:#E6EAFF;
  --sun:#FFB93E; --sun-soft:#FFF2D6; --coral:#FF6B5A; --coral-soft:#FFE6E2; --mint:#1FB58A; --mint-soft:#DDF5EC; --sky:#2E9BF0; --sky-soft:#DDEFFD; --grape:#8A5CF5; --grape-soft:#EEE7FF;
  --good:#138A5E; --warn:#B26A00; --bad:#D23C2A; --good-soft:#DDF5EC; --warn-soft:#FFF0D4; --bad-soft:#FFE4DF;
  --s-civ:#0F9E8E; --s-con:#7B4FE0; --s-k:#E5702F; --s-crim:#D9364F; --s-ev:#2F80ED; --s-rp:#3C9D4E; --s-torts:#C98B00; --s-ca:#C2418C;
  --h0:#E6E9F2; --h1:#C7D0FF; --h2:#8E9EFF; --h3:#5B73FF; --h4:#2F45D6;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1020; --surface:#161A2E; --sunk:#1E2339; --ink:#ECEEFA; --muted:#A1A7C2; --line:#2A3050;
  --mast:#1B2456; --mast-ink:#F4F6FF; --mast-muted:#B8C0E6;
  --accent:#8C9DFF; --accent-ink:#0D1020; --accent-soft:#252C55;
  --sun:#FFC45E; --sun-soft:#3A3020; --coral:#FF8A7B; --coral-soft:#3D2226; --mint:#43D3A6; --mint-soft:#163A30; --sky:#5CB4F6; --sky-soft:#17304A; --grape:#AE8BFF; --grape-soft:#2C2350;
  --good:#43D3A6; --warn:#FFC45E; --bad:#FF8A7B; --good-soft:#163A30; --warn-soft:#3A3020; --bad-soft:#3D2226;
  --s-civ:#3FD3C1; --s-con:#AE8BFF; --s-k:#FF9A5E; --s-crim:#FF7088; --s-ev:#6CB0FF; --s-rp:#6CD07D; --s-torts:#F2BE3A; --s-ca:#F07DBF;
  --h0:#20253D; --h1:#2B3570; --h2:#3E4FB0; --h3:#6578FF; --h4:#A7B3FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1020; --surface:#161A2E; --sunk:#1E2339; --ink:#ECEEFA; --muted:#A1A7C2; --line:#2A3050;
  --mast:#1B2456; --mast-ink:#F4F6FF; --mast-muted:#B8C0E6;
  --accent:#8C9DFF; --accent-ink:#0D1020; --accent-soft:#252C55;
  --sun:#FFC45E; --sun-soft:#3A3020; --coral:#FF8A7B; --coral-soft:#3D2226; --mint:#43D3A6; --mint-soft:#163A30; --sky:#5CB4F6; --sky-soft:#17304A; --grape:#AE8BFF; --grape-soft:#2C2350;
  --good:#43D3A6; --warn:#FFC45E; --bad:#FF8A7B; --good-soft:#163A30; --warn-soft:#3A3020; --bad-soft:#3D2226;
  --s-civ:#3FD3C1; --s-con:#AE8BFF; --s-k:#FF9A5E; --s-crim:#FF7088; --s-ev:#6CB0FF; --s-rp:#6CD07D; --s-torts:#F2BE3A; --s-ca:#F07DBF;
  --h0:#20253D; --h1:#2B3570; --h2:#3E4FB0; --h3:#6578FF; --h4:#A7B3FF; color-scheme:dark}

html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:1100px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:700;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:30px;line-height:1.1}
h2{font-size:21px;line-height:1.2}
h3{font-size:17px;line-height:1.3}
p{margin:0}
.muted{color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.small{font-size:13px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* masthead */
.mast{background:var(--mast);color:var(--mast-ink)}
.mast .inner{padding-block:22px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px 28px;align-items:end}
@media (max-width:760px){.mast .inner{grid-template-columns:1fr}}
.mast .hello{font-size:14px;color:var(--mast-muted);font-weight:600}
.mast h1{color:var(--mast-ink);font-size:clamp(22px,3.4vw,32px);font-weight:800;margin-top:4px}
.mast .aff{font-family:var(--display);font-weight:600;font-size:clamp(17px,2.2vw,21px);color:#FFD27A;margin-top:8px;line-height:1.3}
.pills{display:flex;gap:10px;flex-wrap:wrap}
.pill{border-radius:14px;padding:10px 14px;min-width:120px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14)}
.pill b{display:block;font-family:var(--mono);font-size:26px;line-height:1.05;font-weight:500}
.pill span{font-size:12px;color:var(--mast-muted)}
.pill.sun b{color:#FFD27A}.pill.mint b{color:#7FE8C5}.pill.sky b{color:#9CD2FF}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.tabs .inner{display:flex;gap:6px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.tabs a{flex:none;display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--muted);font-weight:700;font-size:14px;padding:8px 13px;border-radius:999px}
.tabs a:hover{color:var(--ink);background:var(--sunk)}
.tabs a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
main.inner{padding-block:20px 72px}

/* blocks */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(310px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;min-width:0}
.panel>header{display:flex;justify-content:space-between;align-items:center;gap:10px 12px;margin-bottom:12px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 15px;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sun{background:var(--sun);border-color:var(--sun);color:#1D1A10}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
textarea{resize:vertical;line-height:1.55}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:13px;font-weight:700;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.sun{background:var(--sun-soft);color:var(--ink)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.subj{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px 3px 8px;border-radius:999px;white-space:nowrap;color:var(--ink);background:color-mix(in srgb,var(--c) 16%,var(--surface))}
.subj::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.empty{padding:22px;border:1.5px dashed var(--line);border-radius:var(--r);color:var(--muted);text-align:center}
.banner{padding:10px 14px;border-radius:10px;background:var(--warn-soft);color:var(--ink);font-size:14px;margin-bottom:14px}
hr.rule{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}
.tint{border-radius:var(--r);padding:18px 20px;min-width:0}
.tint.sun{background:var(--sun-soft)}.tint.mint{background:var(--mint-soft)}.tint.sky{background:var(--sky-soft)}.tint.grape{background:var(--grape-soft)}.tint.coral{background:var(--coral-soft)}.tint.acc{background:var(--accent-soft)}
.badge{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;color:#fff}
.badge svg.i{width:20px;height:20px}
.badge.sun{background:var(--sun);color:#1D1A10}.badge.mint{background:var(--mint)}.badge.sky{background:var(--sky)}.badge.grape{background:var(--grape)}.badge.coral{background:var(--coral)}.badge.acc{background:var(--accent);color:var(--accent-ink)}

/* today */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px}
@media (max-width:820px){.hero{grid-template-columns:1fr}}
.focus-cta{background:linear-gradient(135deg,#3D5AFE,#8A5CF5);color:#fff;border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:16px;justify-content:space-between}
.focus-cta .prompt{font-family:var(--display);font-size:21px;font-weight:600;line-height:1.3}
.focus-cta .btn{align-self:flex-start;font-size:15px;padding:11px 18px}
.three{display:grid;gap:10px}
.task{display:flex;gap:12px;align-items:center;padding:12px;border-radius:12px;background:var(--sunk)}
.task.done{background:var(--good-soft)}
.tick{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--muted);display:grid;place-items:center;cursor:pointer;background:var(--surface);padding:0;font-weight:800;color:#fff}
.tick.on{background:var(--good);border-color:var(--good)}
.task .t{font-weight:700}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,16px);gap:4px;overflow-x:auto;padding:3px 3px 6px}
.heat button,.heat i,.heat-key i{width:16px;height:16px;border-radius:4px;background:var(--h0);border:0;padding:0;display:block}
.heat button{cursor:pointer}
.heat button:hover{outline:2px solid var(--muted);outline-offset:1px}
.heat i.future{opacity:.35}
.heat .l1,.heat-key .l1{background:var(--h1)}.heat .l2,.heat-key .l2{background:var(--h2)}.heat .l3,.heat-key .l3{background:var(--h3)}.heat .l4,.heat-key .l4{background:var(--h4)}
.heat .today{outline:2px solid var(--sun);outline-offset:1px}
.heat .sel{outline:2.5px solid var(--accent);outline-offset:1px}
.heat-key{display:inline-flex;gap:3px}.heat-key i{width:12px;height:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.stat{padding:12px 14px;border-radius:12px;background:var(--sunk)}
.stat b{display:block;font-family:var(--mono);font-size:24px;font-weight:500;line-height:1.1}
.stat span{font-size:12.5px;color:var(--muted)}
.feel{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mood-log{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.mood-log div{display:flex;gap:10px}
.mood-log .num{color:var(--muted);flex:none;width:52px}

/* bars */
.bar{height:9px;border-radius:999px;background:var(--sunk);overflow:hidden;flex:1;min-width:60px}
.bar>i{display:block;height:100%;border-radius:999px}
.weak{display:grid;grid-template-columns:minmax(0,1fr) minmax(70px,170px) 50px 62px;gap:9px 12px;align-items:center;font-size:14px}
.weak .s{min-width:0;display:flex;flex-direction:column;align-items:flex-start}
.subj-h{grid-column:1/-1;margin-top:10px;display:flex;gap:10px;align-items:center}
.lose{display:flex;flex-direction:column;gap:8px}
.lose .it{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--sunk)}
.lose .pts{font-family:var(--mono);font-size:20px;color:var(--bad);text-align:right}

/* cards */
.flash{min-height:270px;display:flex;flex-direction:column;gap:14px;border-top:5px solid var(--c,var(--accent))}
.flash .cue{font-family:var(--display);font-weight:600;font-size:23px;line-height:1.3}
.flash .ans{font-size:16px;padding:14px 16px;background:var(--mint-soft);border-radius:12px}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate .btn{flex-direction:column;gap:2px;justify-content:center}
.rate .btn small{font-weight:500;color:var(--muted);font-size:11.5px}
.rate .r0{border-color:var(--bad);color:var(--bad)}.rate .r1{border-color:var(--warn);color:var(--warn)}.rate .r2{border-color:var(--good);color:var(--good)}.rate .r3{border-color:var(--sky);color:var(--sky)}

/* recall */
.recall{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px}
@media (max-width:820px){.recall{grid-template-columns:1fr}}
.topics{display:flex;flex-direction:column;gap:4px}
.topic{display:flex;justify-content:space-between;gap:8px;align-items:center;text-align:left;border:1px solid transparent;background:transparent;border-radius:10px;padding:8px 10px;cursor:pointer;width:100%}
.topic:hover{background:var(--sunk)}
.topic.on{background:var(--accent-soft);border-color:var(--accent)}
.topic .n{min-width:0;font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.page{font-family:var(--mono);font-size:14.5px;min-height:320px;background-color:var(--surface);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 26px;line-height:26px;padding:4px 14px}
.reader{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
.toc-tog{display:none}
@media (max-width:860px){.reader{grid-template-columns:1fr}.reader .toc-side{position:static;max-height:none;padding:12px 16px}.toc-tog{display:inline-flex}.toc-side:not(.open) .toc-body{display:none}.toc-side header{margin:0!important}.pdfwrap{height:78vh}}
.toc-side{position:sticky;top:64px;max-height:calc(100vh - 84px);overflow:auto}
.toc-side .sec{border-top:1px solid var(--line);padding:6px 0}
.toc-side .sec:first-of-type{border-top:0}
.toc-side .sh{display:flex;width:100%;gap:8px;align-items:center;background:none;border:0;padding:6px 4px;font-weight:700;font-size:13.5px;text-align:left;cursor:pointer;color:var(--ink)}
.toc-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center;padding:2px 0 2px 10px}
.toc-row .go{background:none;border:0;text-align:left;padding:5px 6px;border-radius:8px;cursor:pointer;font-size:13.5px;color:var(--ink);display:flex;justify-content:space-between;gap:8px}
.toc-row .go:hover,.toc-row .go.on{background:var(--accent-soft)}
.toc-row .go .pp{font-family:var(--mono);font-size:12px;color:var(--muted);flex:none}
.pdfwrap{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--sunk)}
.pdfwrap{height:calc(100vh - 150px);min-height:480px;overflow:auto;-webkit-overflow-scrolling:touch}
.pdfpages{display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px;margin:0 auto}
.pdfpages .pg{position:relative;width:100%;background:#fff;border-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.18);overflow:hidden}
.pdfpages .pg canvas{display:block;width:100%;height:100%}
.pdfpages .pg .pn{position:absolute;right:8px;bottom:6px;font:600 11px var(--mono);color:#667;background:rgba(255,255,255,.85);padding:1px 6px;border-radius:6px}
.ol-cover{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.ol-cover button{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:14px;border-radius:14px;border:1px solid var(--line);border-top:5px solid var(--c);background:var(--surface);cursor:pointer;color:var(--ink)}
.ol-cover button:hover{background:var(--sunk)}
.ol-cover button strong{font-family:var(--display);font-size:17px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.ol-subj{display:flex;flex-wrap:wrap;gap:6px}
.ol-subj .btn{gap:6px}.ol-subj .btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.ol-group{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ol-group>button.gh{display:flex;width:100%;align-items:center;gap:10px;padding:11px 14px;background:var(--sunk);border:0;cursor:pointer;text-align:left;font-weight:700;font-size:14.5px;color:var(--ink)}
.ol-group>button.gh .bar{max-width:90px}
.ol-list{display:flex;flex-direction:column}
.ol-item{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 14px;border:0;border-top:1px solid var(--line);background:var(--surface);text-align:left;cursor:pointer;font-size:14px;color:var(--ink);width:100%}
.ol-item:hover{background:var(--accent-soft)}
.ol-item .pp{font-family:var(--mono);font-size:12px;color:var(--muted)}
.ref{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--sun-soft);font-size:13.5px}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.check:first-child{border-top:0}
.check label{flex:1;cursor:pointer}
.check input{margin-top:4px;width:17px;height:17px;accent-color:var(--good)}

/* table */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
td.rule{min-width:260px;max-width:440px}
td select{min-width:180px;padding:6px 8px}

svg text{fill:var(--muted);font-family:var(--mono);font-size:11px}
svg .lbl{fill:var(--ink)}

/* playbook */
.toc{display:flex;gap:8px;flex-wrap:wrap}
.pb h2{display:flex;align-items:center;gap:12px}
.cov{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.cov .c{border-radius:12px;padding:14px;background:color-mix(in srgb,var(--c) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 30%,var(--line))}
.cov ul{margin:8px 0 0;padding-left:18px;font-size:14px}
.steps{counter-reset:s;display:grid;gap:10px;margin:0;padding:0;list-style:none}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:center}
.steps li::before{content:counter(s);width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-family:var(--display)}
.ticks{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ticks li{display:flex;gap:10px}
.ticks li::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--c,var(--accent));margin-top:8px}
.timing{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center}
@media (max-width:560px){.timing{grid-template-columns:repeat(4,minmax(0,1fr))}}
.timing div{background:var(--sky-soft);border-radius:10px;padding:8px 4px}
.timing b{display:block;font-family:var(--mono);font-size:18px}
.timing span{font-size:12px;color:var(--muted)}
.flow{display:grid;gap:10px}
.node{border-radius:12px;padding:12px 14px;border:1.5px solid var(--line);background:var(--surface)}
.node.q{border-color:var(--s-crim);background:color-mix(in srgb,var(--s-crim) 8%,var(--surface))}
.node.out{border-color:var(--accent);background:var(--accent-soft)}
.fork{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.arrow{text-align:center;color:var(--muted);font-weight:800;line-height:1}
.ck{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.ck:first-child{border-top:0}
.ck input{width:20px;height:20px;margin-top:2px;accent-color:var(--good);flex:none}

/* notes */
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.notes article{display:flex;flex-direction:column;gap:8px}
.notes article .how{padding:10px 12px;border-radius:10px;background:var(--sunk)}
.notes .src{font-size:12.5px;color:var(--muted)}

/* focus overlay, a fixed dark room in both themes */
[hidden]{display:none!important}
.focus{position:fixed;inset:0;z-index:50;background:#0B0E1C;color:#EEF0FB;display:flex;flex-direction:column;overflow-y:auto;
  padding:max(20px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.focus .in{max-width:660px;width:100%;margin:auto;display:flex;flex-direction:column;gap:18px}
.focus h2{color:#EEF0FB;font-size:26px}
.focus .muted{color:#9FA6C4}
.focus textarea,.focus input,.focus select{background:#151A30;border-color:#2B3254;color:#EEF0FB}
.focus .btn{background:#151A30;border-color:#2B3254;color:#EEF0FB}
.focus .btn.go{background:#FFC45E;border-color:#FFC45E;color:#1D1A10}
.focus .btn.pick{border-color:#FFC45E;color:#FFC45E}
.focus .remind{border:1px solid #2B3254;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.focus .remind ol{margin:0;padding-left:20px;display:grid;gap:3px}
.timer{font-family:var(--mono);font-size:clamp(64px,18vw,128px);line-height:1;text-align:center;font-weight:500;color:#FFC45E;font-variant-numeric:tabular-nums}
.intent{font-family:var(--display);font-weight:600;font-size:22px;text-align:center;line-height:1.35}
.faff{text-align:center;color:#9CD2FF;font-family:var(--display);font-weight:600;font-size:17px}
.ring{height:5px;background:#1E2440;border-radius:999px;overflow:hidden}
.ring i{display:block;height:100%;background:linear-gradient(90deg,#FFC45E,#FF8A7B);transition:width 1s linear}
.focus .x{position:absolute;top:max(14px,env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px))}
@media (prefers-reduced-motion:reduce){.ring i{transition:none}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:60;max-width:calc(100% - 32px);text-align:center}

function demoData(){

  DEMO_RAW.sets.forEach(s => { const d = at(s.off); out.sets[s.id] = {...s, date:d, questions:s.questions.map(q => ({...q, date:d}))}; });
  DEMO_RAW.sessions.forEach((s,i) => { out.sessions["demo-s"+i] = {...s, date:at(s.off), planned:s.minutes}; });
  DEMO_RAW.recall.forEach(r => { out.recall[r.id] = {name:r.name, subject:r.subject, checklist:r.checklist, attempts:r.attempts.map(a=>({...a, date:at(a.off)})), due:at(r.dueOff), lastGap:r.lastGap}; });

async function connect(){
  if (DEMO){ Object.assign(S, demoData()); dbState = "demo"; COLS.forEach(c => ready[c] = true); render(); return; }
  try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch(e){ db = null; }
  if (!db){ dbState = "off"; render(); return; }
  dbState = "on";
  COLS.forEach(c => db.collection(c).onSnapshot(snap => {
      if (c === "settings"){ const d = snap.docs.find(x=>x.id==="main"); if (d) Object.assign(S.settings, d.data()); }
      else { const o = {}; snap.docs.forEach(d => o[d.id] = d.data()); S[c] = o; }
      ready[c] = true; schedule();
    }, err => { console.warn(c, err); if (err.code==="revoked"){ dbState="off"; schedule(); } }));
}
async function put(col,id,data){
  if (col==="settings") Object.assign(S.settings,data); else S[col][id] = data;
  schedule(); if (!db) return;
  try { await db.collection(col).doc(id).set(data); }
  catch(e){ console.warn(e); toast(e.code==="quota_exceeded" ? "Storage is full. Download a backup and clear old data." : "That didn't save. Check your connection and try again."); }
}
async function del(col,id){ delete S[col][id]; schedule(); if (db) try { await db.collection(col).doc(id).delete(); } catch(e){ toast("That didn't delete. Try again."); } }

function allQuestions(){ const out = []; Object.values(S.sets).forEach(s => (s.questions||[]).forEach(q => out.push({...q, set:s, key:`${s.id}_${q.q}`, day: usDate(q.date||s.date)}))); return out; }
function setTotals(s){ if (s.questions && s.questions.length && !s.summaryOnly) return {total:s.questions.length, correct:s.questions.filter(q=>q.ans===q.correct).length}; return {total:s.total||0, correct:s.correct||0}; }
function subtopicStats(){
  const m = {};
  allQuestions().forEach(q => { if (q.set.summaryOnly) return; const k = q.subject+"|"+q.subtopic; const r = m[k] || (m[k] = {subject:q.subject, subtopic:q.subtopic, n:0, right:0}); r.n++; if (q.ans===q.correct) r.right++; });
  return Object.values(m).map(r => { const p = pct(r.right,r.n), w = WEIGHT[r.subject+"|"+r.subtopic] || 3; return {...r, p, w, lose: +(w*(1-p/100)).toFixed(1)}; });
}
function subjectStats(){
  const m = {};
  Object.values(S.sets).forEach(s => { const t = setTotals(s);
    if (s.questions && !s.summaryOnly) s.questions.forEach(q => { const r = m[q.subject] || (m[q.subject]={n:0,right:0}); r.n++; if (q.ans===q.correct) r.right++; });
    else if (s.subject){ const r = m[s.subject] || (m[s.subject]={n:0,right:0}); r.n += t.total; r.right += t.correct; } });
  return m;
}
function totalQs(){ return Object.values(S.sets).reduce((a,s)=>a+setTotals(s).total,0); }
function cardList(){ return allQuestions().filter(q => q.note && isMiss(q)).map(q => ({key:q.key, cue:q.cue || `${q.subtopic}. State the rule you missed.`, note:q.note, q, st:S.cards[q.key]})); }
function dueCards(filter){
  const t = today(), list = cardList().filter(c => filter==="All" || c.q.subject===filter);
  const due = list.filter(c => c.st && c.st.due <= t);
  const newDoneToday = Object.values(S.cards).filter(c => c.introduced === t).length;
  const fresh = list.filter(c => !c.st).slice(0, Math.max(0, (S.settings.newPerDay||15) - newDoneToday));
  return {due, fresh, all:list};
}
function sessionsByDay(){ const m = {}; Object.values(S.sessions).forEach(s => { m[s.date] = (m[s.date]||0) + (s.minutes||0); }); return m; }

// A study day is any day with a focus session, logged study time, a flashcard review, a blank page or a practice set.
function activityByDay(){
  const m = {}; const add = (d,k,v=1) => { if (!d) return; const r = m[d] || (m[d] = {min:0, sessions:[], cards:0, recall:0, sets:[]}); if (k==="min") r.min += v; else if (k==="sessions"||k==="sets") r[k].push(v); else r[k] += v; };
  Object.entries(S.sessions).forEach(([id,s]) => { add(s.date,"min",s.minutes||0); add(s.date,"sessions",{id,...s}); });
  Object.values(S.cards).forEach(c => add(c.last,"cards"));
  Object.values(S.recall).forEach(r => (r.attempts||[]).forEach(a => add(a.date,"recall")));
  Object.values(S.sets).forEach(s => add(usDate(s.date),"sets",s.name));
  return m;
}

function heatmap(act){
  const t = today(), start = addDays(weekOf(t), -15*7), sel = ui.heatDay || t; let h = "";
  for (let i=0;i<16*7;i++){ const d = addDays(start,i), r = act[d], m = r ? r.min : 0, f = d>t;
    const l = !r ? 0 : m<30 ? 1 : m<90 ? 2 : m<180 ? 3 : 4;
    h += f ? `<i class="future"></i>` : `<button class="l${l} ${d===t?"today":""} ${d===sel?"sel":""}" data-act="pickDay" data-d="${d}" title="${fmtDay(d)}: ${r?(m?m+" min":"studied"):"no study"}" aria-label="${fmtDay(d)}, ${r?(m?m+" minutes":"studied"):"no study"}"></button>`; }
  return `<div class="heat">${h}</div>`;
}

function nextState(st, r){
  const t = today(); st = st ? {...st} : {interval:0, ease:2.5, reps:0, lapses:0, introduced:t};
  if (r===0){ st.lapses++; st.ease = Math.max(1.3, st.ease-0.2); st.interval = 0; }
  else if (!st.reps || st.interval===0){ st.interval = [0,1,3,6][r]; if (r===1) st.ease = Math.max(1.3, st.ease-0.15); if (r===3) st.ease += 0.15; }
  else { if (r===1){ st.interval = Math.max(1, Math.round(st.interval*1.2)); st.ease = Math.max(1.3, st.ease-0.15); }
    if (r===2) st.interval = Math.max(st.interval+1, Math.round(st.interval*st.ease));
    if (r===3){ st.interval = Math.max(st.interval+2, Math.round(st.interval*st.ease*1.3)); st.ease += 0.15; } }
  st.reps++; st.last = t; st.due = addDays(t, st.interval); return st;
}

// Each outline doc holds its table of contents grouped into blank page topics, with PDF page ranges.
const OL_ORDER = ["civpro","conlaw","contracts","crimlaw","crimpro","evidence","property","torts","corps","wills-trusts"];
const outlines = () => Object.values(S.outlines).sort((a,b)=>(OL_ORDER.indexOf(a.key)+99)%99 - (OL_ORDER.indexOf(b.key)+99)%99);
function recallByRef(){ const m = {}; Object.entries(S.recall).forEach(([id,r]) => { if (r.ref) m[r.ref.id] = [id,r]; }); return m; }
function olState(entry){ if (!entry) return "new"; const a = (entry[1].attempts||[]).at(-1); if (!a) return "started"; return a.got===a.total ? "solid" : "working"; }
function olCoverage(o, by){ let started=0, solid=0; o.topics.forEach(tp => { const s = olState(by[tp.id]); if (s!=="new") started++; if (s==="solid") solid++; }); return {started, solid, total:o.topics.length}; }
const olChip = (entry) => { const s = olState(entry); if (s==="new") return `<span class="chip">new</span>`; if (s==="started") return `<span class="chip sun">started</span>`;
  const a = entry[1].attempts.at(-1), p = pct(a.got,a.total), due = entry[1].due && entry[1].due <= today();
  return `<span class="chip ${due?"sun":tone(p)}">${due?"due":s==="solid"?"✓ "+p+"%":p+"%"}</span>`; };
const pdfPages = r => r.pdf[0]===r.pdf[1] ? `PDF page ${r.pdf[0]}` : `PDF pages ${r.pdf[0]} to ${r.pdf[1]}`;
// What to write next: anything due first, then the next untouched outline topic in your weakest MBE subject.
function nextBlankPage(){
  const t = today();
  const due = Object.entries(S.recall).filter(([,r]) => (r.attempts||[]).length && r.due && r.due <= t).sort((a,b)=>a[1].due.localeCompare(b[1].due))[0];
  if (due) return {kind:"due", id:due[0], name:due[1].name, subject:due[1].subject};
  const by = recallByRef(), st = subjectStats();
  const acc = o => { const r = st[o.subject]; return r && r.n ? r.right/r.n : 2; };
  const o = outlines().filter(o => o.topics.some(tp => !by[tp.id])).sort((a,b) => acc(a)-acc(b))[0];
  if (!o) return null;
  const tp = o.topics.find(tp => !by[tp.id]);
  return {kind:"outline", key:o.key, id:tp.id, name:tp.name, subject:tp.subject, label:o.label};
}

    put("recall", rid, {name:tp.name, subject:tp.subject, checklist:[...tp.items], attempts:[], due:today(), from:"themis", ref:{key, id, label:o.label, group:tp.group, pdf:tp.pdf}}); }
  ui.recallStage="write"; ui.recallRound=1; ui.editList=false; ui.olKey=key; clearOnNext("recallText");

// PDF reader. The page runs in a sandboxed frame where the browser's own PDF viewer is blocked,
// so pages are drawn to canvases with PDF.js (worker code runs on the main thread).
const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
let pdfLibP = null;
const loadScript = src => new Promise((res, rej) => { const el = document.createElement("script"); el.src = src; el.onload = res; el.onerror = () => rej(new Error("script")); document.head.appendChild(el); });
function pdfLib(){
  if (!pdfLibP) pdfLibP = (async () => { await loadScript(PDFJS+"pdf.min.js"); await loadScript(PDFJS+"pdf.worker.min.js");
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS+"pdf.worker.min.js"; return window.pdfjsLib; })().catch(e => { pdfLibP = null; throw e; });
  return pdfLibP;
}
const RD = { key:null, wrap:null, doc:null, blob:null, zoom:1, done:new Map(), obs:null, jumped:null, token:0 };
function mountReader(){
  const wrap = $("#view .pdfwrap[data-k]"); if (!wrap) return;
  const key = wrap.dataset.k, want = ui.rdPage;
  if (RD.key === key && RD.wrap === wrap){ if (RD.doc && want && want !== RD.jumped) rdJump(want); return; }
  rdLoad(wrap, key);
}
async function rdLoad(wrap, key){
  const o = S.outlines[key], my = ++RD.token;
  if (RD.obs) RD.obs.disconnect();
  Object.assign(RD, {key, wrap, doc:null, blob:null, done:new Map(), obs:null, jumped:null});
  const fail = msg => { if (my===RD.token) wrap.innerHTML = `<div class="empty stack" style="gap:10px;align-items:center"><span>${msg}</span><button class="btn sm" data-act="rdRetry">Try again</button></div>`; };
  try {
    const [lib, buf] = await Promise.all([pdfLib(), fetch("/_blob/"+o.asset).then(r => { if (!r.ok) throw new Error("http "+r.status); return r.arrayBuffer(); })]);
    if (my !== RD.token) return;
    RD.blob = new Blob([buf], {type:"application/pdf"});
    const doc = await lib.getDocument({data:new Uint8Array(buf), isEvalSupported:false}).promise;
    if (my !== RD.token) return;
    RD.doc = doc;
    const p1 = await doc.getPage(1), vp = p1.getViewport({scale:1}), ratio = vp.height / vp.width;
    let h = `<div class="pdfpages" style="width:${RD.zoom*100}%;max-width:${RD.zoom*900}px">`;
    for (let n=1; n<=doc.numPages; n++) h += `<div class="pg" data-n="${n}" style="aspect-ratio:1/${ratio.toFixed(4)}"><span class="pn">${n}</span></div>`;
    wrap.innerHTML = h + `</div>`;
    RD.obs = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) rdPaint(+e.target.dataset.n); }), {root:wrap, rootMargin:"600px 0px"});
    wrap.querySelectorAll(".pg").forEach(el => RD.obs.observe(el));
    wrap.onscroll = () => { clearTimeout(RD.st); RD.st = setTimeout(rdTrack, 150); };
    const last = (lsGet("bd-reader")||{})[key];
    rdJump(ui.rdPage || last || (o.topics[0] ? o.topics[0].pdf[0] : 1));
  } catch(e){ console.warn(e); fail(String(e.message).startsWith("http") ? "The outline file didn't load." : "The PDF viewer didn't load. Check your connection."); }
}
async function rdPaint(n){
  if (!RD.doc || RD.done.get(n) === RD.zoom) return;
  RD.done.set(n, RD.zoom);
  const el = RD.wrap.querySelector(`.pg[data-n="${n}"]`); if (!el) return;
  try {
    const page = await RD.doc.getPage(n), base = page.getViewport({scale:1});
    const dpr = Math.min(window.devicePixelRatio || 1, 2), scale = (el.clientWidth || 800) * dpr / base.width;
    const vp = page.getViewport({scale}), c = document.createElement("canvas");
    c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
    await page.render({canvasContext:c.getContext("2d"), viewport:vp}).promise;
    if (RD.done.get(n) !== RD.zoom) return;
    el.querySelector("canvas")?.remove(); el.prepend(c);
  } catch(e){ RD.done.delete(n); }
}
function rdJump(n){
  const el = RD.wrap && RD.wrap.querySelector(`.pg[data-n="${n}"]`); if (!el) return;
  RD.jumped = n; RD.wrap.scrollTop = el.offsetTop - 8; rdPaint(n);
}
function rdTrack(){
  if (!RD.wrap) return; const top = RD.wrap.scrollTop + RD.wrap.clientHeight/3;
  let cur = 1; RD.wrap.querySelectorAll(".pg").forEach(el => { if (el.offsetTop <= top) cur = +el.dataset.n; });
  const inp = $("#rdPageIn"); if (inp && document.activeElement !== inp) inp.value = cur;
  const l = lsGet("bd-reader") || {}; l[RD.key] = cur; lsSet("bd-reader", l);
}
function rdZoom(d){
  if (!RD.doc) return; const cur = +($("#rdPageIn")||{}).value || 1;
  RD.zoom = Math.min(3, Math.max(1, +(RD.zoom + d*0.5).toFixed(1)));
  const box = RD.wrap.querySelector(".pdfpages"); box.style.width = RD.zoom*100+"%"; box.style.maxWidth = RD.zoom*900+"px";
  RD.done = new Map(); RD.wrap.querySelectorAll(".pg canvas").forEach(c => c.style.opacity = ".6");
  rdJump(cur); RD.wrap.querySelectorAll(".pg").forEach(el => { const r = el.getBoundingClientRect(), w = RD.wrap.getBoundingClientRect(); if (r.bottom > w.top-600 && r.top < w.bottom+600) rdPaint(+el.dataset.n); });
}
async function rdSave(){
  const o = S.outlines[RD.key]; if (!RD.blob || !o){ toast("The outline is still loading"); return; }
  try { const d = window.claude && await window.claude.use("downloads"); if (!d) throw {code:"unavailable"}; await d.save({filename:`Themis ${o.label}.pdf`.replace(/&/g,"and"), data:RD.blob}); }
  catch(e){ if (e && e.code==="declined") return; toast("Saving isn't available in this view"); }
}

function scoreChart(sets){
  if (!sets.length) return `<div class="empty">No sets yet.</div>`;
  const W=720,H=250,L=40,R=16,T=18,B=50, iw=W-L-R, ih=H-T-B;
  const x = i => L + (sets.length===1? iw/2 : i*iw/(sets.length-1)), y = p => T + ih - p/100*ih;
  const pts = sets.map((s,i)=>{ const t=setTotals(s), p=pct(t.correct,t.total), sj = s.subject || [...new Set((s.questions||[]).map(q=>q.subject))][0] || ""; return {x:x(i), y:y(p), p, s, sj}; });
  const grid = [0,25,50,75,100].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`).join("");
  const goal = `<line x1="${L}" x2="${W-R}" y1="${y(S.settings.mbeGoal)}" y2="${y(S.settings.mbeGoal)}" stroke="var(--sun)" stroke-width="2" stroke-dasharray="6 5"/>`;
  const area = `<path d="M${pts[0].x},${y(0)} ${pts.map(p=>`L${p.x},${p.y}`).join(" ")} L${pts.at(-1).x},${y(0)} Z" fill="var(--accent)" opacity=".1"/>`;
  const line = `<path d="${pts.map((p,i)=>`${i?"L":"M"}${p.x},${p.y}`).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>`;
  const dots = pts.map((p,i)=>`<circle cx="${p.x}" cy="${p.y}" r="${i===pts.length-1?7:5.5}" fill="${sc(p.sj)}" stroke="var(--surface)" stroke-width="2"/><text class="lbl" x="${p.x}" y="${p.y-12}" text-anchor="middle">${p.p}%</text>
    <text x="${p.x}" y="${H-30}" text-anchor="middle">${esc((p.s.name||"").replace("PASS ","").replace("Homework","HW"))}</text><text x="${p.x}" y="${H-15}" text-anchor="middle" style="fill:${sc(p.sj)}">${esc(p.sj.split(" ")[0])}</text>`).join("");
  return `<div class="tablewrap"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:520px;display:block" role="img" aria-label="Score by practice set">${grid}${goal}${area}${line}${dots}</svg></div>`;
}

    </ul>`)}
  </div>`;
}

// ---------- Notes ----------
function vNotes(){
  const i = Math.floor(daysBetween("2026-01-05", today())/7) % NOTES.length, colors = ["acc","sun","mint","sky","grape","coral"];
  return `<div class="stack" style="gap:16px">
    <div class="stack" style="gap:6px;max-width:68ch"><h2>Study notes</h2><p class="muted">What the research on learning says, and how to use it in bar prep. A new one leads the Today page each week.</p></div>
    <div class="notes">${NOTES.map((n,j)=>`<article class="panel"><div class="row"><span class="badge ${colors[j%6]}">${ic("bulb")}</span><span class="label">${esc(n.k)}</span>${j===i?`<span class="chip sun">this week</span>`:""}</div>
      <h3>${esc(n.t)}</h3><p>${esc(n.f)}</p><p class="how"><strong>In bar prep.</strong> ${esc(n.h)}</p><p class="src">${esc(n.s)}</p></article>`).join("")}</div></div>`;
}

// ---------- Focus mode ----------
const F = { stage:"plan", type:"MBE questions", len:50, intention:"", start:0, end:0, paused:0, pauseAt:0, stopAt:0, timer:0, lock:null, outcome:"", fix:"" };
const TYPES = ["MBE questions","Flashcards","Blank page recall","Timed essay","Performance test","Outline review","Other"];
function reminder(){
  const l = F.type==="MBE questions" ? ["How to attack each question",MBE_ATTACK] : F.type==="Timed essay" ? ["Essay checklist",IRAC_REMIND] : F.type==="Performance test" ? ["PT checklist",PT_REMIND] : null;
  return l ? `<div class="remind"><span class="label" style="color:#9FA6C4">${l[0]}</span><ol>${l[1].map(s=>`<li>${esc(s)}</li>`).join("")}</ol></div>` : "";
}
function paceText(){ const el = (F.len*60000 - remaining())/60000, n = Math.round(F.len/1.8); return `At MBE pace you'd be on question ${Math.min(Math.floor(el/1.8)+1, n)} of ${n}`; }
function openFocus(type, intent, len){ if (type) F.type = type; if (intent) F.intention = intent; if (len) F.len = len; F.stage = "plan"; $("#focus").hidden = false; document.body.style.overflow="hidden"; drawFocus(); setTimeout(()=>{ const el=$("#fIntent"); if (el) el.focus(); },30); }
function closeFocus(){ clearInterval(F.timer); releaseLock(); $("#focus").hidden = true; document.body.style.overflow=""; document.title="Bar Prep Dashboard Demo"; if (document.fullscreenElement) document.exitFullscreen().catch(()=>{}); schedule(); }
function remaining(){ const now = F.pauseAt || Date.now(); return Math.max(0, F.end + F.paused - now); }
function drawFocus(){
  const el = $("#focus"), aff = AFFIRM[(dayNo()+5) % AFFIRM.length];
  if (F.stage==="plan") el.innerHTML = `<button class="btn x" data-f="close">Close</button><div class="in">
    <span class="label" style="color:#9FA6C4">Focus mode</span>
    <h2>What will you finish in this session?</h2>
    <textarea id="fIntent" rows="3" placeholder="Be specific. e.g. 33 mixed MBE questions in 60 minutes, then tag every miss." aria-label="Session goal">${esc(F.intention)}</textarea>
    <div class="stack" style="gap:8px"><span class="label" style="color:#9FA6C4">Type of work</span>
      <div class="row">${TYPES.map(t=>`<button class="btn sm ${t===F.type?"pick":""}" data-f="type" data-v="${t}">${t}</button>`).join("")}</div></div>
    <div class="stack" style="gap:8px"><span class="label" style="color:#9FA6C4">Length</span>
      <div class="row">${[25,50,60,90,180].map(m=>`<button class="btn sm ${m===F.len?"pick":""}" data-f="len" data-v="${m}">${m>=60?(m/60)+" hr"+(m>60?"s":""):m+" min"}</button>`).join("")}</div></div>
    ${reminder()}
    <div class="remind"><span class="label" style="color:#9FA6C4">Before you press start</span><span>Phone in another room. Other tabs closed. Water on the desk.</span></div>
    <div class="row"><button class="btn go" data-f="start">Start ${F.len} minutes</button><span class="muted small" id="fErr"></span></div></div>`;
  else if (F.stage==="run"){ const r = remaining(), tot = F.len*60000;
    el.innerHTML = `<div class="in" style="gap:24px">
      <span class="label" style="color:#9FA6C4;text-align:center">${esc(F.type)}${F.pauseAt?" · paused":""}</span>
      <div class="timer" id="fClock">${mmss(r/1000)}</div>
      <div class="ring"><i id="fRing" style="width:${100-100*r/tot}%"></i></div>
      ${F.type==="MBE questions"?`<p class="faff" id="fPace" style="color:#9FA6C4;font-size:15px">${paceText()}</p>`:""}
      <p class="intent">${esc(F.intention)}</p>
      <p class="faff">${esc(aff)}</p>
      <div class="row" style="justify-content:center"><button class="btn" data-f="pause">${F.pauseAt?"Resume":"Pause"}</button><button class="btn" data-f="finish">End session</button>${document.fullscreenEnabled?`<button class="btn" data-f="fs">Full screen</button>`:""}</div></div>`; }
  else el.innerHTML = `<div class="in">
    <span class="label" style="color:#9FA6C4">Session done · ${Math.round(elapsedMin())} minutes</span>
    <h2>Did you do what you set out to do?</h2>
    <p class="intent" style="text-align:left;font-size:19px;opacity:.85">${esc(F.intention)}</p>
    <div class="row">${["Yes","Partly","No"].map(o=>`<button class="btn ${F.outcome===o?"pick":""}" data-f="outcome" data-v="${o}">${o}</button>`).join("")}</div>
    <label class="field"><span style="color:#9FA6C4">One thing to do differently next session</span><input type="text" id="fFix" value="${esc(F.fix)}" placeholder="e.g. Tag misses right after the set, not later"></label>
    <div class="row"><button class="btn go" data-f="save">Save session</button><button class="btn" data-f="discard">Don't log it</button></div></div>`;
}
function elapsedMin(){ return Math.max(0, ((F.stopAt||Date.now()) - F.start - F.paused)/60000); }
function tick(){ if (F.stage!=="run") return; const r = remaining(), c=$("#fClock"), g=$("#fRing"), p=$("#fPace");
  if (c) c.textContent = mmss(r/1000); if (g) g.style.width = (100-100*r/(F.len*60000))+"%"; if (p) p.textContent = paceText();
  document.title = F.pauseAt ? "Paused" : `${mmss(r/1000)} · Focus`;
  if (r<=0){ chime(); stopRun(); } }
function stopRun(){ clearInterval(F.timer); F.stopAt = Date.now(); if (F.pauseAt){ F.paused += Date.now()-F.pauseAt; F.pauseAt=0; } F.stage="done"; releaseLock(); document.title="Bar Prep Dashboard Demo"; drawFocus(); }
async function getLock(){ try { if ("wakeLock" in navigator) F.lock = await navigator.wakeLock.request("screen"); } catch(e){} }
function releaseLock(){ try { F.lock && F.lock.release(); } catch(e){} F.lock=null; }
function chime(){ try { const a = new (window.AudioContext||window.webkitAudioContext)(); [0,0.35,0.7].forEach(t=>{ const o=a.createOscillator(), g=a.createGain(); o.frequency.value=660; g.gain.setValueAtTime(0.0001,a.currentTime+t); g.gain.exponentialRampToValueAtTime(0.2,a.currentTime+t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+t+0.3); o.connect(g).connect(a.destination); o.start(a.currentTime+t); o.stop(a.currentTime+t+0.32); }); } catch(e){} }
$("#focus").addEventListener("input", e => { if (e.target.id==="fIntent") F.intention = e.target.value; if (e.target.id==="fFix") F.fix = e.target.value; });
$("#focus").addEventListener("click", e => {
  const b = e.target.closest("[data-f]"); if (!b) return; const f = b.dataset.f;
  if (f==="close") closeFocus();
  if (f==="type"){ F.type = b.dataset.v; if (F.type==="Timed essay") F.len = 60; if (F.type==="Performance test") F.len = 90; drawFocus(); }
  if (f==="len"){ F.len = +b.dataset.v; drawFocus(); }
  if (f==="start"){ if (!F.intention.trim()){ $("#fErr").textContent = "Write what you'll finish first. A specific goal is what makes the session count."; $("#fIntent").focus(); return; }
    F.start = Date.now(); F.end = F.start + F.len*60000; F.paused = 0; F.pauseAt = 0; F.stopAt = 0; F.outcome=""; F.fix=""; F.stage="run"; getLock(); drawFocus(); F.timer = setInterval(tick, 1000); }
  if (f==="pause"){ if (F.pauseAt){ F.paused += Date.now()-F.pauseAt; F.pauseAt = 0; getLock(); } else { F.pauseAt = Date.now(); releaseLock(); } drawFocus(); }
  if (f==="finish") stopRun();
  if (f==="fs"){ (document.documentElement.requestFullscreen ? document.documentElement.requestFullscreen() : Promise.reject()).catch(()=>{}); }
  if (f==="outcome"){ F.outcome = b.dataset.v; drawFocus(); }
  if (f==="save"){ put("sessions", uid(), { date: ymd(new Date(F.start)), start:new Date(F.start).toISOString(), minutes: Math.round(elapsedMin()), planned:F.len, type:F.type, intention:F.intention.trim(), outcome:F.outcome||"", fix:F.fix.trim() });
    F.intention = ""; toast(`Session logged. ${AFFIRM[Math.floor(Math.random()*AFFIRM.length)]}`); closeFocus(); }
  if (f==="discard"){ F.intention=""; closeFocus(); }
});
document.addEventListener("visibilitychange", () => { if (document.visibilityState==="visible" && F.stage==="run" && !F.pauseAt) getLock(); });

// ---------- actions ----------
const confirm2 = (b, label) => { if (b.dataset.sure) return true; b.dataset.sure="1"; b.textContent=label||"Click again"; return false; };
$("#view").addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.tagName==="SELECT" || (b.tagName==="INPUT" && b.type!=="checkbox")) return;
  const a = b.dataset.act, t = today();
  if (a==="focus") openFocus(b.dataset.type);
  if (a==="pickDay"){ ui.heatDay = b.dataset.d; schedule(); return; }
  if (a==="logTime"){ ui.logTime = !ui.logTime; schedule(); return; }
  if (a==="goal"){ const g = Math.min(7, Math.max(1, (S.settings.weekGoal||5) + (+b.dataset.d))); put("settings","main",{...S.settings, weekGoal:g}); return; }
  if (a==="saveTime"){ const d = $("#ltDate").value || t, m = Math.round(+$("#ltMin").value||0);
    if (m < 1){ toast("Enter how many minutes"); return; } if (d > t){ toast("Pick today or an earlier day"); return; }
    put("sessions", uid(), { date:d, start:new Date(d+"T12:00:00").toISOString(), minutes:m, planned:m, type:$("#ltType").value, intention:$("#ltNote").value.trim(), outcome:"", fix:"", manual:true });
    ui.logTime = false; ui.heatDay = d; toast(`Added ${m} min`); return; }
  if (a==="delSession"){ if (!confirm2(b,"Remove?")) return; del("sessions", b.dataset.id); return; }
  if (a==="tick"){ const d = S.days[t] ? JSON.parse(JSON.stringify(S.days[t])) : {}; d.checks = d.checks||{}; d.checks[b.dataset.k] = b.getAttribute("aria-pressed")!=="true"; put("days", t, d); }
  if (a==="saveFeel"){ const d = S.days[t] ? JSON.parse(JSON.stringify(S.days[t])) : {checks:{}}; d.feel1=$("#feel1").value.trim(); d.feel2=$("#feel2").value.trim(); d.nurture=$("#nurture").value.trim(); put("days", t, d); toast("Check-in saved. Now go take care of it."); }
  if (a==="reveal"){ ui.cardRevealed = true; render(); }
  if (a==="rate"){ const k = ui.cardCurrent, r = +b.dataset.r; ui.cardRevealed = false; ui.cardCurrent = null; clearOnNext("cardTry"); put("cards", k, nextState(S.cards[k], r)); if (r===0) toast("It'll come back later today"); }
  if (a==="newTopic"){ ui.newTopic = !ui.newTopic; render(); }
  if (a==="createTopic"){ const name = $("#ntName").value.trim(); if (!name){ toast("Name the topic first"); return; } const id = uid(); ui.topic=id; ui.newTopic=false; ui.editList=true; ui.recallStage="write"; ui.recallRound=1; put("recall", id, {name, subject:$("#ntSubject").value, checklist:[], attempts:[], due:t}); }
  if (a==="suggest"){ const subject=b.dataset.s, name=b.dataset.t; let items;
    if (b.dataset.kind==="starter") items = (STARTERS.find(s=>s.name===name)||{list:[]}).list.slice();
    else items = [...new Set(allQuestions().filter(q=>q.subject===subject && q.subtopic===name && isMiss(q) && q.note).map(q=>q.note))];
    const id = uid(); ui.topic=id; ui.recallStage="write"; ui.recallRound=1; ui.editList=false; clearOnNext("recallText"); put("recall", id, {name, subject, checklist:items, attempts:[], due:t, from:b.dataset.kind}); }
  if (a==="rdOpen"){ ui.rdKey=b.dataset.k; ui.rdPage=null; schedule(); window.scrollTo(0,0); return; }
  if (a==="rdBack"){ ui.rdKey=null; schedule(); return; }
  if (a==="rdGroup"){ ui.rdOpen[b.dataset.g] = b.getAttribute("aria-expanded")!=="true"; schedule(); return; }
  if (a==="rdToc"){ ui.rdToc = !ui.rdToc; schedule(); return; }
  if (a==="rdZoom"){ rdZoom(+b.dataset.d); return; }
  if (a==="rdSave"){ rdSave(); return; }
  if (a==="rdRetry"){ RD.key=null; mountReader(); return; }
  if (a==="rdGo" || a==="rdGoIn"){ const o = S.outlines[ui.rdKey]; if (!o) return;
    const p = Math.min(o.pages, Math.max(1, Math.round(+(a==="rdGo" ? b.dataset.p : $("#rdPageIn").value) || 1)));
    ui.rdPage = p; RD.jumped = null; if (a==="rdGo" && window.innerWidth <= 860){ ui.rdToc = false; setTimeout(()=>{ const w=$("#view .pdfwrap"); w && w.scrollIntoView({block:"start"}); }, 60); } const l = lsGet("bd-reader") || {}; l[o.key] = p; lsSet("bd-reader", l); clearOnNext("rdPageIn"); schedule(); return; }
  if (a==="olKey"){ ui.olKey = b.dataset.k; schedule(); return; }
  if (a==="olGroup"){ const k = b.dataset.g; ui.olOpen[k] = b.getAttribute("aria-expanded")!=="true"; schedule(); return; }
  if (a==="olStart"){ startOutlineTopic(b.dataset.k, b.dataset.id); return; }
  if (a==="olBrowse"){ ui.topic=null; ui.newTopic=false; schedule(); return; }
  if (a==="olOpenRecall"){ ui.topic=null; ui.olKey=b.dataset.k; if (route==="recall") schedule(); else location.hash="#recall"; return; }
  if (a==="pickTopicGo"){ ui.topic=b.dataset.id; ui.recallStage="write"; ui.recallRound=1; ui.editList=false; ui.recallGot={}; clearOnNext("recallText"); location.hash="#recall"; return; }
  if (a==="pickTopic"){ ui.topic=b.dataset.id; ui.recallStage="write"; ui.recallRound=1; ui.editList=false; ui.recallGot={}; clearOnNext("recallText"); render(); }
  if (a==="editList"){ ui.editList = !ui.editList; render(); }
  if (a==="addItem"){ const inp = $("#newItem") || $("#addMissed"); const v = inp && inp.value.trim(); if (!v) return; const r = {...S.recall[ui.topic]}; r.checklist = [...(r.checklist||[]), v]; clearOnNext(inp.id); put("recall", ui.topic, r); }
  if (a==="rmItem"){ const r = {...S.recall[ui.topic]}; r.checklist = r.checklist.filter((_,i)=>i!==+b.dataset.i); put("recall", ui.topic, r); }
  if (a==="delTopic"){ if (confirm2(b,"Click again to delete")){ const id = ui.topic; ui.topic=null; ui.editList=false; del("recall", id); } }
  if (a==="checkRecall"){ ui.recallTextSaved = ($("#recallText")||{}).value || ""; ui.recallGot = {}; ui.recallStage="check"; render(); }
  if (a==="got"){ ui.recallGot[+b.dataset.i] = b.checked; render(); }
  if (a==="saveRecall"){ const r = JSON.parse(JSON.stringify(S.recall[ui.topic])), total = r.checklist.length, got = r.checklist.filter((_,i)=>ui.recallGot[i]).length;
    r.attempts = [...(r.attempts||[]), {date:t, got, total, round:ui.recallRound}].slice(-40);
    const full = got===total; r.lastGap = full ? Math.min(30, (r.lastGap||1)*2+1) : 1; r.due = addDays(t, r.lastGap);
    ui.recallStage="write"; ui.recallGot={}; clearOnNext("recallText");
    if (b.dataset.again){ ui.recallRound++; toast(`Round ${ui.recallRound}. Blank page again.`); setTimeout(()=>{ const ta=$("#recallText"); ta && ta.focus(); },80); }
    else { ui.recallRound=1; toast(full?`All ${total} items. Back in ${r.lastGap} days.`:`${got} of ${total}. Back tomorrow.`); }
    put("recall", ui.topic, r);
    if (b.dataset.next && r.ref){ const o = S.outlines[r.ref.key], i = o ? o.topics.findIndex(x=>x.id===r.ref.id) : -1, nx = o && o.topics[i+1];
      if (nx) startOutlineTopic(o.key, nx.id); else { ui.topic=null; toast(`That was the last section of ${r.ref.label}.`); } } }
  if (a==="logForm"){ ui.logForm = !ui.logForm; render(); }
  if (a==="helpReason"){ ui.helpReason = !ui.helpReason; render(); }
  if (a==="saveSet") saveSet();
  if (a==="delSet"){ if (confirm2(b)) del("sets", b.dataset.id); }
  if (a==="reflect"){ ui.reflect = b.dataset.id || null; render(); if (ui.reflect) setTimeout(()=>{ const el=$("#rf_common"); el && el.scrollIntoView({block:"center"}); },30); }
  if (a==="saveReflect"){ const id=b.dataset.id; const data = {common:$("#rf_common").value.trim(), fix:$("#rf_fix").value.trim(), area:$("#rf_area").value.trim(), rules:$("#rf_rules").value.trim(), date:t}; ui.reflect=null; put("reflections", id, data); toast("Reflection saved"); }
  if (a==="essayForm"){ ui.essayForm = !ui.essayForm; render(); }
  if (a==="addEssay"){ const v=$("#essayName").value.trim(); if(!v) return; const s=$("#essaySubj").value; ui.essayForm=false; put("essays", uid(), {name:v, subjects:[s], kind:s==="Performance Test"?"PT":"essay", stage:STAGES[0], added:t, order:50}); }
  if (a==="delEssay"){ if (confirm2(b)) del("essays", b.dataset.id); }
  if (a==="writeEssay"){ const e = S.essays[b.dataset.id]; openFocus(e.kind==="PT"?"Performance test":"Timed essay", `Write ${e.name} cold, start to finish`, e.kind==="PT"?90:60); }
  if (a==="assess"){ ui.assess = b.dataset.id || null; render(); if (ui.assess) window.scrollTo({top:0,behavior:"smooth"}); }
  if (a==="assessTick"){ const e = JSON.parse(JSON.stringify(S.essays[b.dataset.id])); e.assess = e.assess||{}; e.assess[b.dataset.k] = b.checked;
    const list = e.kind==="PT"?PTCHECK:BRAVERY; if (list.every(([k])=>e.assess[k]) && STAGES.indexOf(e.stage)<2) e.stage = STAGES[2]; put("essays", b.dataset.id, e); }
  if (a==="savePlan"){ put("essays", b.dataset.id, {...S.essays[b.dataset.id], plan:$("#asPlan").value.trim()}); toast("Plan saved"); }
  if (a==="admit"){ put("admit", b.dataset.k, {done:b.checked, date:t}); if (b.checked) toast("One step closer to being sworn in"); }
  if (a==="jump"){ const el = document.getElementById(b.dataset.h); el && el.scrollIntoView({behavior:"smooth", block:"start"}); }
  if (a==="saveSettings"){ put("settings","main",{ weekGoal: Math.min(7,Math.max(1,+$("#setWeek").value||5)), newPerDay: Math.max(1,+$("#setNew").value||15), mbeGoal: Math.min(100,Math.max(30,+$("#setGoal").value||65)) }); toast("Settings saved"); }
  if (a==="export") exportData();
});

$("#view").addEventListener("change", e => {
  const el = e.target, a = el.dataset.act; if (!a) return;
  if (a==="rdSwitch"){ ui.rdKey = el.value; ui.rdPage = null; render(); return; }
  if (a==="cardFilter"){ ui.cardFilter = el.value; ui.cardCurrent=null; ui.cardRevealed=false; render(); }
  if (a==="logFilter"){ ui.logFilter = el.value; render(); }
  if (a==="logScope"){ ui.logScope = el.value; render(); }
  if (a==="logUntagged"){ ui.logUntagged = el.checked; render(); }
  if (a==="tag"){ put("tags", el.dataset.k, {reason: el.value, at: today()}); }
  if (a==="essayStage"){ put("essays", el.dataset.id, {...S.essays[el.dataset.id], stage: el.value}); }
  if (a==="essayField"){ put("essays", el.dataset.id, {...S.essays[el.dataset.id], [el.dataset.f]: el.value}); }
});
$("#view").addEventListener("keydown", e => {
  if (e.key==="Enter" && (e.target.id==="newItem" || e.target.id==="addMissed")){ e.preventDefault(); const b=e.target.parentElement.querySelector("[data-act=addItem]"); b && b.click(); }
  if (e.key==="Enter" && e.target.id==="ntName"){ e.preventDefault(); $("[data-act=createTopic]").click(); }
});
document.addEventListener("keydown", e => {
  if (route!=="cards" || !$("#focus").hidden || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if (e.key===" " && !ui.cardRevealed){ e.preventDefault(); const b=$("[data-act=reveal]"); b&&b.click(); }
  if (ui.cardRevealed && ["1","2","3","4"].includes(e.key)){ const b=document.querySelector(`[data-act=rate][data-r="${+e.key-1}"]`); b&&b.click(); }
});
function saveSet(){
  const total = +$("#lfTotal").value, correct = +$("#lfCorrect").value;
  if (!total || $("#lfCorrect").value==="" || isNaN(correct) || correct>total){ toast("Enter the number of questions and how many you got right"); return; }
  const id = "log-"+uid(), date = $("#lfDate").value || today(), subject = $("#lfSubject").value;
  const misses = $("#lfMisses").value.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{ const [q,sub,top,...rule]=l.split(",").map(x=>x.trim());
    const o = {q:+q||0, subject: sub||subject, subtopic: top||"General", date, miss:true}; const n = rule.join(", "); if (n) o.note = n; return o; });
  ui.logForm=false; ui.reflect=id;
  put("sets", id, {id, name: $("#lfName").value.trim() || `${subject} set`, source:"Logged", subject: subject==="Mixed"?"":subject, date, total, correct, seconds:(+$("#lfMin").value||0)*60, summaryOnly:true, questions:misses});
  toast("Set logged. Take two minutes to reflect.");
}
async function exportData(){
  const data = JSON.stringify({exported:new Date().toISOString(), ...S}, null, 2);
  try { const d = window.claude && await window.claude.use("downloads"); if (!d) throw 0; await d.save({filename:`bar-prep-backup-${today()}.json`, data}); toast("Backup saved"); }
  catch(e){ toast("Downloads aren't available in this view"); }
}

function go(){ const h = location.hash.replace("#",""); route = TABS.some(t=>t[0]===h) ? h : "today"; ui.cardRevealed=false; render(); window.scrollTo(0,0); }
window.addEventListener("hashchange", go);
go(); connect();
setInterval(()=>{ if (route==="today") schedule(); }, 60000);
})();
